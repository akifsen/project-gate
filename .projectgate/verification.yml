schema_version: 1
discover_baseline: false
timeouts:
  command_ms: 300000
  http_ms: 15000
  browser_ms: 30000
commands:
  - id: typecheck
    title: Typecheck
    command: node
    args:
      - ./node_modules/typescript/bin/tsc
      - -p
      - tsconfig.typecheck.json
      - --noEmit
      - --pretty
      - "false"
    criterion: AC-001
    invalidates_on:
      - "**/*.ts"
      - tsconfig.base.json
      - tsconfig.typecheck.json
      - tsconfig.build.json
    evidence: EXECUTABLE
    group: Typecheck
